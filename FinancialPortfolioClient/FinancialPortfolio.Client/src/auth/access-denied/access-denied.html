<div class="auth-page">

        class="auth-logo mx-auto"
        style="background: linear-gradient(145deg, #ef4444, #dc2626); box-shadow: 0 8px 20px rgba(239, 68, 68, 0.3);">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1 class="auth-title">Access denied</h1>
      <p class="auth-subtitle mb-4">

      </p>
