<div class="auth-page">
  <div class="auth-card card">
    <div class="card-body">
      <div class="text-center mb-3">
        <div class="auth-logo">
          <i class="bi bi-key-fill"></i>
        </div>
        <h1 class="auth-title">Forgot password</h1>
        <p class="auth-subtitle">
          We’ll email you a reset link if the account exists.
        </p>
      </div>

      @if (sent()) {
        <div class="alert alert-success small py-2">
          <i class="bi bi-check-circle me-1"></i>
          If an account exists for that email, a reset link has been sent.
        </div>
        <a routerLink="/login" class="btn btn-primary w-100">Back to sign in</a>
      } @else {
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input
                type="email"
                class="form-control"
                formControlName="email"
                placeholder="you@example.com"
                autocomplete="email"
                [class.is-invalid]="!!error('email', 'Email')"
              />
            </div>
            @if (error('email', 'Email'); as msg) {
              <div class="invalid-feedback d-block small">{{ msg }}</div>
            }
          </div>

          @if (serverError()) {
            <div class="alert alert-danger py-2 small">{{ serverError() }}</div>
          }

          <button
            type="submit"
            class="btn btn-primary w-100 mb-2"
            [disabled]="loading() || form.invalid">
            @if (loading()) {
              <span class="spinner-border spinner-border-sm me-1"></span>
              Sending…
            } @else {
              Send reset link
            }
          </button>

          <a routerLink="/login" class="btn btn-outline-secondary w-100">
            Back to sign in
          </a>
        </form>
      }
    </div>
  </div>
</div>
