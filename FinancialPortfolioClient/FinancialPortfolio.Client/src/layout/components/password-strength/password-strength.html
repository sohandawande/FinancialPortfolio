@if (password()) {
  <div class="password-strength mt-2">
    <div class="progress" style="height: 6px;">
      <div
        class="progress-bar"
        [ngClass]="barClass()"
        [style.width.%]="result().percent"
        role="progressbar">
      </div>
    </div>

    <div class="d-flex justify-content-between small mt-1">
      <span class="text-muted">Password strength</span>
      <span [ngClass]="barClass().replace('bg-', 'text-')">{{ result().label }}</span>
    </div>

    <ul class="list-unstyled small mt-2 mb-0 password-rules">
      <li [class.text-success]="result().hasMinLength" [class.text-muted]="!result().hasMinLength">
        <i class="bi" [class.bi-check-circle-fill]="result().hasMinLength" [class.bi-circle]="!result().hasMinLength"></i>
        At least 8 characters
      </li>
      <li [class.text-success]="result().hasLetter" [class.text-muted]="!result().hasLetter">
        <i class="bi" [class.bi-check-circle-fill]="result().hasLetter" [class.bi-circle]="!result().hasLetter"></i>
        Contains a letter (A–Z)
      </li>
      <li [class.text-success]="result().hasNumber" [class.text-muted]="!result().hasNumber">
        <i class="bi" [class.bi-check-circle-fill]="result().hasNumber" [class.bi-circle]="!result().hasNumber"></i>
        Contains a number (0–9)
      </li>
      <li [class.text-success]="result().hasSymbol" [class.text-muted]="!result().hasSymbol">
        <i class="bi" [class.bi-check-circle-fill]="result().hasSymbol" [class.bi-circle]="!result().hasSymbol"></i>
        Contains a symbol (!@#$…)
      </li>
    </ul>
  </div>
}
