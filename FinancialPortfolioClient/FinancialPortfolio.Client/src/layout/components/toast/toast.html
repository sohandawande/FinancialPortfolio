<div class="toast-host position-fixed top-0 end-0 p-3">
  @for (t of toast.toasts(); track t.id) {
    <div
      class="toast show border-0 mb-2 shadow text-bg-{{ t.type }}"
      role="alert"
      aria-live="assertive">
      <div class="d-flex">
        <div class="toast-body">
          @if (t.title) {
            <strong class="me-1">{{ t.title }}:</strong>
          }
          {{ t.message }}
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Close"
          (click)="toast.dismiss(t.id)">
        </button>
      </div>
    </div>
  }
</div>
