<button
  type="button"
  class="fp-select-trigger"
  [class.open]="open()"
  [disabled]="disabled()"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="ariaLabel()"
  (click)="toggle($event)"
>
  <span class="fp-select-icon"><i class="bi" [class]="icon()"></i></span>
  <span class="fp-select-label">{{ selectedLabel() }}</span>
  <span class="fp-select-caret"><i class="bi bi-chevron-down"></i></span>
</button>

@if (open()) {
  <div class="fp-select-menu" role="listbox">
    @for (option of options(); track option.label + '-' + option.value) {
      <button
        type="button"
        class="fp-select-option"
        role="option"
        [class.active]="option.value === value()"
        (click)="choose(option, $event)"
      >
        <span>{{ option.label }}</span>
        @if (option.value === value()) {
          <i class="bi bi-check2"></i>
        }
      </button>
    }
  </div>
}
