<div class="card border-0 shadow-sm">
  <div class="card-body">
    <div class="d-flex flex-wrap align-items-start justify-content-between gap-2 mb-3">
      <div>
        <div class="text-muted small text-uppercase fw-semibold letter-space">{{ title() }}</div>
        <div class="fs-5 fw-semibold">
          {{ lifetime() | currency:'INR':'symbol':'1.2-2' }}
          <span class="fs-6 fw-normal text-muted">lifetime</span>
        </div>
      </div>
    </div>

    @if (!hasRows()) {
      <p class="text-muted small mb-0">{{ emptyText() }}</p>
    } @else {
      <div class="row g-2">
        @for (y of rows(); track y.year) {
          <div class="col-6 col-sm-4 col-md-3 col-xl-2">
            <div class="year-chip">
              <div class="year-chip-year">{{ y.year }}</div>
              <div class="year-chip-amount">{{ y.amount | currency:'INR':'symbol':'1.2-2' }}</div>
              <div class="year-chip-count text-muted">
                {{ y.count }} payout{{ y.count === 1 ? '' : 's' }}
              </div>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
